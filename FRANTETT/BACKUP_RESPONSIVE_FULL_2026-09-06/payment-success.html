<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - FranTett Healthcare</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #1f2937;
        }

        .card {
            width: min(92%, 520px);
            background: white;
            border-radius: 18px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f7ef;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            color: #198754;
        }

        p {
            line-height: 1.6;
            color: #64748b;
        }

        .reference {
            margin: 25px 0;
            padding: 14px;
            background: #f8fafc;
            border-radius: 10px;
            font-size: 13px;
            word-break: break-all;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 25px;
            border-radius: 9px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">✓</div>

    <h1>Payment Successful</h1>

    <p>
        Thank you. Your payment has been successfully received.
        Your payment record has been updated in FranTett Healthcare.
    </p>

    <div class="reference">
        <strong>Payment Reference</strong>
        <br>
        <span id="sessionId">Processing...</span>
    </div>

    <a href="/pages/patients.html" class="button">
        Return to Patient Portal
    </a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    document.getElementById("sessionId").textContent =
        sessionId || "Payment completed";
</script>

</body>
</html>
