<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff Login - FranTett Healthcare</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(105,184,170,.18), transparent 35%),
            radial-gradient(circle at bottom right, rgba(11,107,92,.12), transparent 35%),
            #f5faf9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        color: #173b36;
    }

    .login-container {
        width: 100%;
        max-width: 460px;
    }

    .login-card {
        background: #ffffff;
        border-radius: 24px;
        padding: 42px 40px;
        box-shadow:
            0 20px 60px rgba(11,107,92,.12),
            0 4px 15px rgba(0,0,0,.05);
        border: 1px solid rgba(11,107,92,.08);
    }

    .brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand-icon {
        width: 68px;
        height: 68px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #0b6b5c;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(11,107,92,.22);
    }

    .brand h1 {
        margin: 0;
        color: #0b6b5c;
        font-size: 27px;
        font-weight: 700;
    }

    .brand p {
        margin: 7px 0 0;
        color: #6b7d79;
        font-size: 14px;
    }

    .portal-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 22px;
        padding: 7px 13px;
        border-radius: 30px;
        background: #eef8f6;
        color: #0b6b5c;
        font-size: 13px;
        font-weight: 700;
    }

    .login-card h2 {
        margin: 0 0 8px;
        color: #173b36;
        font-size: 24px;
    }

    .login-subtitle {
        margin: 0 0 28px;
        color: #71827f;
        line-height: 1.6;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 19px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #294641;
        font-size: 14px;
        font-weight: 700;
    }

    .input-wrapper {
        position: relative;
    }

    .form-group input {
        width: 100%;
        height: 52px;
        padding: 0 15px;
        border: 1px solid #d8e5e2;
        border-radius: 11px;
        background: #fbfdfd;
        color: #173b36;
        font-size: 15px;
        transition: .2s ease;
    }

    .form-group input::placeholder {
        color: #9aaba8;
    }

    .form-group input:focus {
        outline: none;
        border-color: #0b6b5c;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(11,107,92,.09);
    }

    .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #71827f;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        padding: 6px;
    }

    .password-toggle:hover {
        color: #0b6b5c;
    }

    .login-btn {
        width: 100%;
        height: 52px;
        margin-top: 7px;
        border: none;
        border-radius: 11px;
        background: #0b6b5c;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: .2s ease;
        box-shadow: 0 8px 18px rgba(11,107,92,.18);
    }

    .login-btn:hover {
        background: #09584d;
        transform: translateY(-1px);
        box-shadow: 0 11px 24px rgba(11,107,92,.22);
    }

    .login-btn:disabled {
        opacity: .65;
        cursor: not-allowed;
        transform: none;
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
    }

    .error {
        background: #fff0f1;
        color: #a32935;
        border: 1px solid #f3c7cb;
    }

    .success {
        background: #edf9f2;
        color: #176b3b;
        border: 1px solid #c6ead2;
    }

    .security-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 24px;
        color: #71827f;
        font-size: 12px;
    }

    .back-link {
        display: block;
        margin-top: 22px;
        text-align: center;
        color: #0b6b5c;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    .footer-text {
        text-align: center;
        margin-top: 22px;
        color: #91a09d;
        font-size: 12px;
    }

    @media (max-width: 520px) {

        body {
            padding: 20px 14px;
        }

        .login-card {
            padding: 32px 24px;
            border-radius: 20px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .login-card h2 {
            font-size: 22px;
        }
    }

</style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                FranTett Healthcare
            </h1>

            <p class="subtitle">
                Staff Login
            </p>


            <!-- =========================
                 MESSAGE
            ========================= -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <a
                href="appointment.html"
                class="back-link"
            >
                Back to booking
            </a>

        </div>

    </div>


<script>

    const API_URL =
        "http://localhost:3000";


    // ==========================================
    // LOGIN FORM
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const message =
                    document
                        .getElementById("message");


                const loginButton =
                    document
                        .getElementById("loginButton");


                // ==================================
                // CLEAR PREVIOUS MESSAGE
                // ==================================

                message.style.display =
                    "none";


                message.textContent =
                    "";


                // ==================================
                // DISABLE BUTTON
                // ==================================

                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            email,

                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    // ==================================
                    // LOGIN FAILED
                    // ==================================

                    if (!response.ok) {

                        message.className =
                            "message error";


                        message.textContent =
                            data.message ||
                            "Invalid email or password.";


                        message.style.display =
                            "block";


                        loginButton.disabled =
                            false;


                        loginButton.textContent =
                            "Login";


                        return;

                    }


                    // ==================================
                    // STORE JWT TOKEN
                    // ==================================

                    if (!data.token) {

                        message.className =
                            "message error";


                        message.textContent =
                            "Login succeeded but no authentication token was received.";


                        message.style.display =
                            "block";


                        loginButton.disabled =
                            false;


                        loginButton.textContent =
                            "Login";


                        return;

                    }


                    localStorage.setItem(
                        "frantett_token",
                        data.token
                    );


                    // ==================================
                    // SUCCESS MESSAGE
                    // ==================================

                    message.className =
                        "message success";


                    message.textContent =
                        "Login successful. Redirecting...";


                    message.style.display =
                        "block";


                    // ==================================
                    // REDIRECT
                    // ==================================

                    setTimeout(
                        function() {

                            window.location.href =
                                "./dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.className =
                        "message error";


                    message.textContent =
                        "Unable to connect to the server. Make sure the server is running.";


                    message.style.display =
                        "block";


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "Login";

                }

            }
        );

</script>

</body>

</html>
