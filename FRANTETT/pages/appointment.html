<form id="appointmentForm">

    <input type="text" name="name" placeholder="Full Name" required>

    <input type="email" name="email" placeholder="Email Address" required>

    <input type="date" name="date" required>

    <input type="time" name="time" required>

    <input type="tel" name="phone" placeholder="Phone Number" required>

    <select name="doctor" required>
        <option value="">Select a Doctor</option>
        <option value="Dr. Francis Tetteh">Dr. Francis Tetteh</option>
        <option value="Dr. Talent">Dr. Talent</option>
        <option value="Dr. Emily Brown">Dr. Emily Brown</option>
        <option value="Dr. Sam">Dr. Sam</option>
    </select>

    <button type="submit">Book Appointment</button>

</form>

<script>
    const appointmentForm = document.getElementById("appointmentForm");

    appointmentForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const appointment = {
            name: appointmentForm.elements["name"].value,
            email: appointmentForm.elements["email"].value,
            date: appointmentForm.elements["date"].value,
            time: appointmentForm.elements["time"].value,
            phone: appointmentForm.elements["phone"].value,
            doctor: appointmentForm.elements["doctor"].value
        };

        try {
            const response = await fetch("http://localhost:3000/api/appointments", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(appointment)
            });

            const data = await response.json();

            console.log(data);

            alert(data.message);

            appointmentForm.reset();

        } catch (error) {
            console.error("Error:", error);
            alert("Something went wrong. Please try again.");
        }
    });
</script>
