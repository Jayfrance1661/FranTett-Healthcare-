<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - FranTett Healthcare</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav>
        <h2>FranTett Healthcare</h2>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="doctors.html">Doctors</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="appointment.html">Appointments</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h1>Book an Appointment</h1>

        <form id="appointmentForm">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                name="phone"
                placeholder="Phone Number"
                required
            >

            <select name="doctor" required>
                <option value="">Select a Doctor</option>
                <option value="Dr. Francis Tetteh">Dr. Francis Tetteh</option>
                <option value="Dr. Talent">Dr. Talent</option>
                <option value="Dr. Emily Brown">Dr. Emily Brown</option>
                <option value="Dr. Sam">Dr. Sam</option>
            </select>

            <label for="appointment_date">Appointment Date</label>

            <input
                type="date"
                id="appointment_date"
                name="appointment_date"
                required
            >

            <label for="appointment_time">Appointment Time</label>

            <input
                type="time"
                id="appointment_time"
                name="appointment_time"
                required
            >

            <textarea
                name="reason"
                placeholder="Reason for appointment"
                rows="5"
            ></textarea>

            <button type="submit">Book Appointment</button>

        </form>

        <p id="message"></p>

    </main>

    <script>
        const form = document.getElementById("appointmentForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(form);

            const appointment = {
                name: formData.get("name"),
                email: formData.get("email"),
                phone: formData.get("phone"),
                doctor: formData.get("doctor"),
                appointment_date: formData.get("appointment_date"),
                appointment_time: formData.get("appointment_time"),
                reason: formData.get("reason")
            };

            try {
                const response = await fetch(
                    "http://localhost:3000/api/appointments",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(appointment)
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    message.textContent = "Appointment booked successfully!";
                    form.reset();
                } else {
                    message.textContent =
                        data.message || "Failed to book appointment.";
                }

            } catch (error) {
                console.error("Error:", error);
                message.textContent =
                    "Unable to connect to the server.";
            }
        });
    </script>

</body>
</html>
