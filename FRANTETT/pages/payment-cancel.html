<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - FranTett Healthcare</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #1f2937;
        }

        .card {
            width: min(92%, 520px);
            background: white;
            border-radius: 18px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff3cd;
            color: #856404;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            color: #856404;
        }

        p {
            line-height: 1.6;
            color: #64748b;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            border-radius: 9px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">!</div>

    <h1>Payment Cancelled</h1>

    <p>
        Your payment was not completed.
        No successful payment has been recorded for this transaction.
    </p>

    <p>
        You can return to the patient portal and try again when you are ready.
    </p>

    <a href="/pages/patients.html" class="button">
        Return to Patient Portal
    </a>
</div>

</body>
</html>
